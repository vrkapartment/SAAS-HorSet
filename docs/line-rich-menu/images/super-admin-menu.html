<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>HorSet — Rich Menu ทีมงาน (2500x843)</title>
<!--
  ต้นฉบับภาพ rich menu ของ LINE OA ทีมงาน HorSet — แก้ไฟล์นี้แล้วสั่ง render ใหม่ด้วย
      node scripts/build-line-richmenu-images.mjs

  ใช้ชุดสีสว่างชุดเดียวกับเมนูผู้เช่า (คนละ OA กันอยู่แล้ว จึงไม่ต้องแยกด้วยสีพื้น)

  ⚠️ ขนาดและตำแหน่งของทุกช่องต้องตรงกับ areas[].bounds ใน super-admin-oa-richmenu.json เป๊ะ ๆ
       แถวเดียว y 0 สูง 843 : 0-833 | 833-1667 | 1667-2500
-->
<style>
  @font-face {
    font-family: "Prompt";
    src: url("../../../src/app/fonts/Prompt/Prompt-SemiBold.ttf") format("truetype");
    font-weight: 600;
  }
  @font-face {
    font-family: "Prompt";
    src: url("../../../src/app/fonts/Prompt/Prompt-Bold.ttf") format("truetype");
    font-weight: 700;
  }
  @font-face {
    font-family: "Prompt";
    src: url("../../../src/app/fonts/Prompt/Prompt-Medium.ttf") format("truetype");
    font-weight: 500;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2500px;
    height: 843px;
    overflow: hidden;
    font-family: "Prompt", "Leelawadee UI", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .menu {
    position: relative;
    width: 2500px;
    height: 843px;
    background: #ffffff;
  }

  .cell {
    position: absolute;
    top: 0;
    height: 843px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .cell-console { left: 0;      width: 833px; }
  .cell-props   { left: 833px;  width: 834px; }
  .cell-uid     { left: 1667px; width: 833px; }

  /* ทุกช่องพื้นสีเดียวกัน เส้นพวกนี้จึงเป็นตัวเดียวที่บอกขอบปุ่ม ห้ามเอาออก */
  .rule { position: absolute; top: 0; width: 4px; height: 843px; background: #e2e8f0; }
  .rule-left  { left: 831px; }
  .rule-right { left: 1665px; }

  .icon { width: 150px; height: 150px; margin-bottom: 40px; }

  .title    { font-size: 88px; font-weight: 700; line-height: 1.05; letter-spacing: -0.5px; color: #0f172a; }
  .subtitle { font-size: 46px; font-weight: 500; margin-top: 18px; color: #64748b; }

  .ink-blue    { color: #2563eb; }
  .ink-emerald { color: #059669; }
  .ink-indigo  { color: #4f46e5; }
</style>
</head>
<body>
<div class="menu">

  <!-- ปุ่ม 1 : คอนโซลทีมงาน -->
  <div class="cell cell-console">
    <svg class="icon ink-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.6" y="4" width="18.8" height="16" rx="2.2"/>
      <path d="M2.6 9.2h18.8"/>
      <circle cx="6" cy="6.6" r="0.75"/>
      <circle cx="8.6" cy="6.6" r="0.75"/>
    </svg>
    <div class="title">ภาพรวมระบบ</div>
    <div class="subtitle">คอนโซลทีมงาน HorSet</div>
  </div>

  <!-- ปุ่ม 2 : แพ็กเกจ
       (เดิมเป็น "จัดการหอพัก" ชี้ไป /super-admin/workspaces ซึ่งไม่มีหน้าอยู่จริง -> 404
        รายชื่อหอทั้งหมดอยู่ในหน้า /super-admin อยู่แล้ว ปุ่มนี้จึงซ้ำกับปุ่มแรกด้วย) -->
  <div class="cell cell-props">
    <svg class="icon ink-emerald" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 8.4v7.2a2 2 0 01-1.05 1.76l-7 3.8a2 2 0 01-1.9 0l-7-3.8A2 2 0 013 15.6V8.4a2 2 0 011.05-1.76l7-3.8a2 2 0 011.9 0l7 3.8A2 2 0 0121 8.4z"/>
      <path d="M3.3 7.2L12 12l8.7-4.8"/>
      <path d="M12 12v9.4"/>
    </svg>
    <div class="title">แพ็กเกจ</div>
    <div class="subtitle">แผนและราคาของระบบ</div>
  </div>

  <!-- ปุ่ม 3 : ขอ LINE User ID (ส่งข้อความ #MYID ให้ webhook ตอบกลับ) -->
  <div class="cell cell-uid">
    <svg class="icon ink-indigo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.6" y="5" width="18.8" height="14" rx="2.2"/>
      <circle cx="8.6" cy="10.8" r="2.3"/>
      <path d="M5 16.4c.85-1.6 2.1-2.4 3.6-2.4s2.75.8 3.6 2.4"/>
      <path d="M15.2 10h3.4"/>
      <path d="M15.2 13.6h3.4"/>
    </svg>
    <div class="title">ขอ LINE ID</div>
    <div class="subtitle">ผูกบัญชีรับแจ้งเตือน</div>
  </div>

  <div class="rule rule-left"></div>
  <div class="rule rule-right"></div>

</div>
</body>
</html>
